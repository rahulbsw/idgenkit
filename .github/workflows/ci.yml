name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: make test-libs
      - run: make -C c sanitize
      - run: cd rust && cargo clippy --all-targets -- -D warnings
      - run: python3 bench/doc_tables.py --check

  redis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools
      - run: make test-redis

  mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y mysql-server libmysqlclient-dev
      # Ubuntu's AppArmor profile confines mysqld to /var/lib/mysql; test.sh runs a
      # throwaway server with its datadir and plugin_dir under mysql/build/.
      - run: |
          sudo systemctl stop mysql || true
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
          fi
      - run: mysqld --version && make test-mysql
      - if: failure()
        run: cat mysql/build/mysql-test/init.log mysql/build/mysql-test/error.log || true

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: make test-postgres PG_MAJOR=${{ matrix.pg }}
