name: release

# Push a tag vX.Y.Z to publish. Run manually (workflow_dispatch) for a dry run
# that builds and uploads every artifact but publishes nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            v="${GITHUB_REF_NAME#v}"; publish=true
          else
            v=$(awk -F'[<>]' '/<version>/ { print $3; exit }' java/pom.xml); publish=false
          fi
          scripts/version.sh check "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/ci.yml

  build-python:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build python --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: python-dist, path: dist/, if-no-files-found: error }

  build-java:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: mvn -B -ntp -f java/pom.xml -Prelease -Dgpg.skip verify
      - run: mkdir dist && cp java/target/idgenkit-*.jar dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: java-dist, path: dist/, if-no-files-found: error }

  build-native:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools libmysqlclient-dev
      - name: Redis module
        run: |
          make -C redis test
          arch=$(uname -m | sed 's/aarch64/arm64/; s/x86_64/amd64/')
          mkdir -p dist
          tar -czf "dist/idgenkit-redis-$VERSION-linux-$arch.tar.gz" -C redis/build idgenkit.so
      - name: MySQL loadable functions
        run: |
          make -C mysql all
          arch=$(uname -m | sed 's/aarch64/arm64/; s/x86_64/amd64/')
          tar -czf "dist/idgenkit-mysql-$VERSION-linux-$arch.tar.gz" \
            -C mysql/build idgenkit_udf.so -C .. install.sql uninstall.sql
      - name: PostgreSQL extension
        run: for pg in 14 15 16 17 18; do PG_MAJOR=$pg ./postgres/package.sh dist; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "native-${{ matrix.runner }}", path: dist/, if-no-files-found: error }

  publish-pypi:
    needs: [meta, test, build-python]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: { name: pypi, url: https://pypi.org/p/idgenkit }
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: python-dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-crates:
    needs: [meta, test]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: { name: crates-io, url: https://crates.io/crates/idgenkit }
    permissions:
      id-token: write
    env:
      # Only needed for the very first publish; afterwards use crates.io trusted publishing.
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: env.BOOTSTRAP_TOKEN == ''
      - run: cargo publish --locked
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.BOOTSTRAP_TOKEN }}

  publish-maven:
    needs: [meta, test, build-java]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: { name: maven-central, url: https://central.sonatype.com/artifact/io.github.rahulbsw/idgenkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn -B -ntp -f java/pom.xml -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-go:
    # Go modules are served by proxy.golang.org straight from git tags. The module
    # lives in go/, so its tags must be prefixed: go/vX.Y.Z.
    needs: [meta, test]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git tag "go/v$VERSION" "$GITHUB_SHA"
          git push origin "go/v$VERSION"
      - run: |
          module=$(awk '/^module / { print $2 }' go/go.mod)
          for _ in 1 2 3 4 5; do
            curl -fsS "https://proxy.golang.org/$module/@v/v$VERSION.info" && exit 0
            sleep 15
          done
          exit 1

  github-release:
    needs: [meta, build-python, build-java, build-native, publish-pypi, publish-crates, publish-maven, publish-go]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist/, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*" }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
